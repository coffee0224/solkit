[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solkit"
version = "0.1.0"
description = "Speed-of-light analysis for PyTorch reference implementations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "solkit contributors" }]
keywords = ["gpu", "roofline", "speed-of-light", "profiling", "kernel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "pyyaml>=6.0",
]

[project.scripts]
solkit = "solkit.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solkit"]

[tool.ruff]
line-length = 100
target-version = "py310"
force-exclude = true
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["solkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
