# NVIDIA GeForce RTX 5060 Ti (Blackwell, CC 12.0, GB206, 36 SMs, 16GB GDDR7).
# Theoretical values; MAC rates follow the FP16-accumulate convention.
#   fp32: 36 SM * 128 lanes; fp16/bf16 tc: 36 SM * 512; int8: 36 SM * 1024
# Derived and cross-checked with ncu on the target card (pipe-active
# back-calculation); see README "Deriving arch configs" for the method.
# The optional `measured:` block carries ncu-calibrated bandwidth values.
name: "RTX_5060_Ti"
SRAM_capacity: 33554432        # L2 = 32 MiB
SRAM_byte_per_cycle: 910       # ~2.35 TB/s @ 2.58 GHz (ncu LTS back-calc)
DRAM_capacity: 17074421760     # 16 GiB
DRAM_byte_per_cycle: 172       # 441 GB/s @ 2.58 GHz (spec 448 GB/s)
freq_GHz: 2.58                 # sustained SM clock under load (max 3.09)
MAC_per_cycle_fp32_sm: 4608    # 36 SM * 128
MAC_per_cycle_tf32_tc: 9216    # 36 * 256, convention 2:1 vs fp16 (unverified)
MAC_per_cycle_fp16_tc: 18432   # 36 * 512; ncu: s16816 GEMM at 99% pipe = 2x
MAC_per_cycle_bf16_tc: 18432
MAC_per_cycle_int8_tc: 36864   # ncu: torch._int_mm 184.6 TOPS back-calc
MAC_per_cycle_fp8_tc: 73728    # 2x int8 convention (unverified)
